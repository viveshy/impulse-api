[project]
name = "impulse-catalog-sync"
version = "0.1.0"
description = "One-shot sync: LiteLLM + curated overlay → optimized Impulse SQLite catalog."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0.3",
]

[project.scripts]
sync = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
