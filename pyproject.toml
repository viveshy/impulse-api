[project]
name = "impulse-api"
version = "0.1.0"
description = "Read API for the Impulse AI model & provider catalog (paginated, rate-limited, GUID-addressed)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
serve = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
